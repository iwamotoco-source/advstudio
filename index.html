<!DOCTYPE html>
<!-- ADV STUDIO 2.4.0 / 2D Novel Editing Update -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-title" content="my studio">
<meta name="application-name" content="my studio">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<title>my studio</title>
<style>
:root{--bg:#0d1014;--pn:#161b22;--pn2:#1c222c;--ln:#2a3340;--fg:#e8eef6;--sb:#8d9cb0;--ac:#7ab8ff;--dg:#ff7a95;--ok:#6fd39b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--fg);overscroll-behavior:none;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 7px) 9px 7px;
 background:linear-gradient(#1b222c,#12171e);border-bottom:1px solid var(--ln);flex:0 0 auto}
header .tt{flex:1;min-width:0;font-size:13.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tt small{display:block;font-size:9.5px;color:var(--sb);letter-spacing:.14em;font-weight:400}
main{flex:1;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;overflow:auto;padding:9px 9px 22px;display:none;-webkit-overflow-scrolling:touch}
.tab.on{display:block}.tab.fx.on{display:flex;flex-direction:column;overflow:hidden;padding:0}
nav{display:flex;border-top:1px solid var(--ln);background:#11161d;padding-bottom:env(safe-area-inset-bottom);flex:0 0 auto}
nav button{flex:1;background:none;border:0;color:var(--sb);padding:8px 1px 6px;font-size:10px;font-family:inherit}
nav button b{display:block;font-size:16px;line-height:1.25;font-weight:400}
nav button.sel{color:var(--ac)}
.btn{background:var(--pn2);color:var(--fg);border:1px solid var(--ln);border-radius:9px;padding:8px 11px;font-size:12.5px;font-family:inherit;min-height:36px}
.btn:active{background:#2b3543}.btn.ac{background:linear-gradient(#3f82d8,#2f66b4);border-color:#5b9ae8;color:#fff;font-weight:700}
.btn.dg{color:#ffb3c0;border-color:#553040}.btn.sm{padding:5px 8px;min-height:30px;font-size:11.5px}
.btn.ico{width:34px;min-height:34px;padding:0;font-size:15px;flex:0 0 auto}
.btn[disabled]{opacity:.35}
.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:11px;padding:9px;margin-bottom:9px}
.card h3{margin:0 0 7px;font-size:12.5px;color:var(--ac);letter-spacing:.05em}
.sb{color:var(--sb);font-size:11px;line-height:1.7}
label.f{display:block;font-size:11px;color:var(--sb);margin:7px 0 3px}
input[type=text],input[type=number],select,textarea{width:100%;background:#090c11;color:var(--fg);border:1px solid var(--ln);border-radius:8px;padding:8px;font-family:inherit;font-size:14px}
input[type=range]{width:100%}
textarea{resize:none}
.chips{display:flex;gap:5px;overflow-x:auto;padding:5px 2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#1e2630;border:1px solid var(--ln);color:var(--fg);border-radius:999px;padding:6px 11px;font-size:12px;font-family:inherit;white-space:nowrap}
.chip.sel{background:#22354a;border-color:#3a5b7d;color:#bfe0ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}
.as{background:#090c11;border:1px solid var(--ln);border-radius:10px;overflow:hidden;position:relative}
.as img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#05070a}
.as .au{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:26px;color:#5c748f}
.as .id{font-size:10px;padding:3px 4px 0;color:var(--ac);font-weight:700;word-break:break-all}
.as .nm{font-size:9.5px;padding:1px 4px 4px;color:var(--sb);word-break:break-all;line-height:1.3}
.bd{position:absolute;top:3px;left:3px;background:#000b;border:1px solid #fff2;border-radius:5px;font-size:9px;padding:1px 4px}
#shw{position:fixed;inset:0;background:#000b;display:none;z-index:70;align-items:flex-end}#shw.on{display:flex}
#sh{background:var(--pn);width:100%;max-height:88%;overflow:auto;border-radius:15px 15px 0 0;border-top:1px solid var(--ln);padding:11px 11px calc(env(safe-area-inset-bottom) + 14px)}
#sh h2{margin:2px 0 9px;font-size:13.5px;color:var(--ac)}
#tst{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 66px);transform:translateX(-50%);background:#0e151ef2;border:1px solid var(--ln);padding:8px 13px;border-radius:999px;font-size:12px;z-index:95;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#tst.on{opacity:1}
#ov{position:fixed;inset:0;background:#000;z-index:60;display:none}#ov.on{display:block}
#pv{position:absolute;inset:0}
#ovx{position:absolute;top:calc(env(safe-area-inset-top) + 5px);right:7px;z-index:50;background:#000a;color:#fff;border:1px solid #fff3;border-radius:50%;width:32px;height:32px;font-size:15px}
#prev{flex:0 0 auto;position:relative;background:#05070a;border-bottom:1px solid var(--ln);overflow:hidden}
#prevHost{position:absolute;inset:0}
#prevBar{position:absolute;right:5px;top:5px;z-index:20;display:flex;gap:4px}
#prevBar button{background:#000a;border:1px solid #fff3;color:#cfe0f2;border-radius:7px;font-size:10px;padding:4px 7px;font-family:inherit}
#lst{flex:1;overflow:auto;padding:5px 7px 26px;-webkit-overflow-scrolling:touch}
.cc{display:flex;gap:7px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-left:3px solid #39465a;border-radius:9px;padding:7px 8px}
.cc.sel{border-color:var(--ac);background:#17222f;border-left-color:var(--ac)}
.cc.msg{border-left-color:#6fd39b}.cc.msg.nar{border-left-color:#4e6a86}
.cc.fxk{border-left-color:#d39b6f}.cc.hrk{border-left-color:#e05a72}.cc.flk{border-left-color:#b18fe0}
.cc .ic{flex:0 0 auto;width:22px;text-align:center;font-size:14px;color:#9fb4c9}
.cc .bd2{flex:1;min-width:0}
.cc .sp{font-size:10.5px;color:#9fc4ec;letter-spacing:.05em}
.cc .tx{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:3.1em;overflow:hidden}
.cc .cm{font-size:12px;color:#cfd9e6}.cc .ar{font-size:10px;color:var(--sb);word-break:break-all}
.cc img.th{width:34px;height:34px;object-fit:cover;border-radius:6px;flex:0 0 auto;background:#05070a}
.cc .mv{display:flex;flex-direction:column;gap:2px}
.cc .mv button{background:#222c38;border:1px solid var(--ln);color:#cfe0f2;border-radius:5px;width:28px;height:19px;font-size:10px;padding:0;font-family:inherit}
.ins{display:flex;justify-content:center;padding:1px 0}
.ins button{background:none;border:0;color:#46586e;font-size:14px;padding:2px 26px;font-family:inherit}
.ins button:active{color:var(--ac)}
.err{border-left-color:#e05a72 !important;box-shadow:inset 0 0 0 1px #e05a7255}
.lst2{display:flex;flex-direction:column;gap:5px}
.it{display:flex;gap:7px;align-items:center;background:#090c11;border:1px solid var(--ln);border-radius:9px;padding:7px}
.it .g{flex:1;min-width:0}.it b{font-size:12.5px}.it .s{font-size:10px;color:var(--sb)}
.it img{width:36px;height:36px;object-fit:cover;border-radius:6px;background:#05070a}
.fg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.fb{background:#090c11;border:1px solid var(--ln);border-radius:8px;padding:3px;text-align:center}
.fb img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:5px;background:#05070a;display:block}
.fb span{font-size:9px;color:var(--sb);display:block;padding-top:2px}
.fb.e img{opacity:.13}.fb.sel{border-color:var(--ac)}
#cal{position:relative;width:100%;background:#05070a;border-radius:8px;overflow:hidden;touch-action:none}
#cal img{width:100%;display:block}
#calR{position:absolute;border:1px dashed #7ab8ff;background:#7ab8ff12}
#calR .tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#cfe6ff;font-family:serif}
.hd{position:absolute;background:#7ab8ff;border-radius:3px}
.hd.t,.hd.b{left:50%;width:38px;height:13px;margin-left:-19px;cursor:ns-resize}
.hd.l,.hd.r{top:50%;height:38px;width:13px;margin-top:-19px;cursor:ew-resize}
.hd.t{top:-7px}.hd.b{bottom:-7px}.hd.l{left:-7px}.hd.r{right:-7px}
#crp{position:relative;width:100%;background:#05070a;border-radius:8px;overflow:hidden;touch-action:none}
#crp img{width:100%;display:block}
#crpR{position:absolute;border:2px solid #6fd39b;background:#6fd39b1a}
#crpR .h{position:absolute;width:22px;height:22px;background:#6fd39b;border-radius:4px}
#crpR .h.br{right:-11px;bottom:-11px}
.wn{color:#ffc07a;font-size:11.5px;line-height:1.7}
code{background:#090c11;border:1px solid var(--ln);border-radius:4px;padding:1px 4px;font-size:11.5px;color:#bfe0ff}
.ref p{margin:5px 0;font-size:12px;line-height:1.75;color:#cfd9e6}
#backupAge{font-size:9px;line-height:1.25;color:#9fb4c9;white-space:nowrap;text-align:center;max-width:64px}
#backupAge.warn{color:#ffc07a}
#saveFailOverlay{position:fixed;inset:0;z-index:140;background:#000c;display:none;align-items:center;justify-content:center;padding:18px}
#saveFailOverlay.on{display:flex}
#saveFailOverlay .sf{width:min(430px,100%);background:#161b22;border:1px solid #ff7a9555;border-radius:14px;padding:14px;box-shadow:0 18px 60px #000b}
#saveFailOverlay h2{font-size:15px;margin:0 0 8px;color:#ffb3c0}
#saveFailOverlay p{font-size:12px;line-height:1.7;color:#dbe6f2;white-space:pre-wrap;word-break:break-word}
@media(max-width:700px){input,select,textarea,#ta{font-size:16px!important}#saveState{font-size:10px;max-width:85px}#cardActions .btn{padding:8px}}
/* Touch-first editing */
.btn,.btn.sm,.btn.ico,.chip,nav button,#prevBar button,.ins button{min-height:44px;min-width:44px}
.btn.ico{width:44px}.cc .mv{flex-direction:row}.cc .mv button{width:44px;height:44px}
header{flex-wrap:wrap}header .tt{min-width:100px}#saveState,#backupAge{flex-shrink:0}
select,input[type=text],input[type=number]{min-height:44px}
#ovx{width:44px;height:44px}#sh{overscroll-behavior:contain}
#cal{overflow:visible}#cal .region{position:absolute;border:2px dashed #7ab8ff;background:#7ab8ff22;touch-action:none;cursor:move}
#cal .region.name{border-color:#ffd36f;background:#ffd36f22}
#cal .region.active{outline:2px solid white;z-index:3}
#cal .region span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;pointer-events:none;color:white;text-shadow:0 1px 3px black}
#cal .sizeHandle{position:absolute;right:-12px;bottom:-12px;width:44px;height:44px;border-radius:50%;background:#2676bccc;border:2px solid white}
.calnums{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
@media(max-height:600px){#prev{max-height:32%}#cardActions{max-height:100px;overflow:auto}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="tt" id="hdTitle">暮石村<small>ADV STUDIO 2.4.0</small></div>
  <button class="btn ico" id="bUndo">↶</button><button class="btn ico" id="bRedo">↷</button>
  <button class="btn ac" id="bPlay">▶ 再生</button>
 </header>
 <main>
  <section class="tab" id="t-as"></section>
  <section class="tab" id="t-ch"></section>
  <section class="tab" id="t-ui"></section>
  <section class="tab fx on" id="t-sc">
   <div id="prev"><div id="prevHost"></div>
    <div id="prevBar"><button data-p="size">⇕</button><button data-p="full">⛶</button></div></div>
   <div class="row" style="padding:5px 7px;border-bottom:1px solid var(--ln);background:#11161d">
    <select id="scSel" style="flex:1;min-width:0"></select>
    <button class="btn sm" id="scMenu">…</button>
    <button class="btn sm" id="scMode">文</button>
    <button class="btn sm" id="scChk">検証</button>
   </div>
   <div id="lst"></div><div id="cardActions" class="row" style="padding:6px;flex-shrink:0;flex-wrap:wrap"></div>
  </section>
  <section class="tab" id="t-cf"></section>
 </main>
 <nav>
  <button data-t="as"><b>◼</b>素材</button>
  <button data-t="ch"><b>☻</b>キャラ</button>
  <button data-t="ui"><b>▤</b>UI</button>
  <button data-t="sc" class="sel"><b>✎</b>シナリオ</button>
  <button data-t="cf"><b>⚙</b>設定</button>
 </nav>
</div>
<div id="ov"><div id="pv"></div><button id="ovx">×</button></div>
<div id="shw"><div id="sh"></div></div>
<div id="tst"></div>
<input type="file" id="fAs" accept="image/*,audio/*" multiple hidden>
<input type="file" id="fZip" multiple hidden>
<input type="file" id="fRestore" accept=".zip" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>

<script>
/* ============ util ============ */
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _tt;function toast(m){const t=$('#tst');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),2200);}
const fsz=n=>n>1048576?(n/1048576).toFixed(1)+'MB':(n/1024).toFixed(0)+'KB';
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},6000);}
const sheetStack=[];
function sheet(title,html,after){const host=$('#sh');if(title.endsWith('を選ぶ')&&$('#shw').classList.contains('on')){const nodes=[...host.childNodes];sheetStack.push({nodes,cb:shClose.cb});nodes.forEach(n=>n.remove());}else{sheetStack.length=0;}shClose.cb=null;host.innerHTML='<h2>'+esc(title)+'</h2>'+html+'<div class="row" style="margin-top:11px"><button class="btn" style="flex:1" id="shX">閉じる</button></div>';$('#shw').classList.add('on');$('#shX').onclick=shClose;if(after)after(host);}
function shClose(){const cb=shClose.cb;shClose.cb=null;$('#sh').innerHTML='';if(sheetStack.length){const prev=sheetStack.pop();prev.nodes.forEach(n=>$('#sh').appendChild(n));shClose.cb=prev.cb;}else $('#shw').classList.remove('on');if(cb)cb(null);}
$('#shw').addEventListener('click',e=>{if(e.target.id==='shw')shClose();});
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}

/* ============ assets (IndexedDB) ============ */
const DBN='kureishi_studio2',DBV=2;
function odb(){return new Promise((s,j)=>{if(!('indexedDB' in window))return j(Error('IndexedDB非対応'));
 const r=indexedDB.open(DBN,DBV);
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('a'))d.createObjectStore('a',{keyPath:'id'});if(!d.objectStoreNames.contains('project'))d.createObjectStore('project',{keyPath:'key'});};
 r.onsuccess=()=>s(r.result);r.onerror=()=>j(r.error||Error('IndexedDBを開けません'));r.onblocked=()=>j(Error('他のADV STUDIOがデータベースを使用中です'));});}
function dbtx(store,mode,fn){return odb().then(d=>new Promise((s,j)=>{let out;try{const t=d.transaction(store,mode),st=t.objectStore(store);out=fn(st);t.oncomplete=()=>{const v=out&&out.q?out.q.result:out;d.close();s(v);};t.onerror=t.onabort=()=>{const e=t.error||Error(store+' 保存失敗');d.close();j(e);};}catch(e){d.close();j(e);}}));}
function tx(mode,fn){return dbtx('a',mode,fn);}
const aPut=o=>tx('readwrite',st=>({q:st.put(o)})),aDel=i=>tx('readwrite',st=>({q:st.delete(i)})),aAll=()=>tx('readonly',st=>({q:st.getAll()}));
const pGet=()=>dbtx('project','readonly',st=>({q:st.get('current')}));
const pPut=o=>dbtx('project','readwrite',st=>({q:st.put(o)}));
let AS=[];const UC=new Map();
const AX=i=>AS.find(x=>x.id===i);
const A=i=>AS.find(x=>x.id===i&&!x.deleted);
function auid(){return 'a_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));}
function url(i){if(!i)return '';const a=A(i);if(!a)return '';if(UC.has(i))return UC.get(i);const u=URL.createObjectURL(a.blob);UC.set(i,u);return u;}
function urlAny(i){if(!i)return '';const a=AX(i);if(!a)return '';if(UC.has(i))return UC.get(i);const u=URL.createObjectURL(a.blob);UC.set(i,u);return u;}
const th=i=>{const a=A(i);return a&&a.thumb?a.thumb:url(i);};
const thAny=i=>{const a=AX(i);return a&&a.thumb?a.thumb:urlAny(i);};
const KIND={bg:'背景/CG',chara:'立ち絵',ui:'UI',bgm:'BGM',se:'SE'};
const PFX={bg:'bg',chara:'fc',ui:'ui',bgm:'bgm',se:'se'};
function nid(kind,base){let n=(base||'').normalize('NFKC').replace(/\.[^.]+$/,'').replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase();
 if(!n||!/[a-z]/.test(n))n=PFX[kind]+'_'+String(AS.filter(a=>a.kind===kind&&!a.deleted).length+1).padStart(2,'0');
 if(/^\d/.test(n))n=PFX[kind]+'_'+n;let id=n,k=2;while(AX(id))id=n+'_'+(k++);return id;}
function gkind(p){const s=p.toLowerCase(),e=(s.split('.').pop()||'');
 if(['mp3','ogg','wav','m4a','aac','opus','flac'].includes(e))return /se|sfx|効果音/.test(s)?'se':'bgm';
 if(!['png','jpg','jpeg','webp','gif','avif','bmp'].includes(e))return null;
 if(/表情|face|差分|立ち絵|stand|chara/.test(s))return 'chara';
 if(/ui素材|文章ui|ウィンドウ|ウインドウ|名前欄|選択肢|フレーム|枠|window|frame|ログ画面|システムメッセージ|侵食|回想|暗転|古文書|記録用紙|研究ノート|日記|手紙/.test(s))return 'ui';
 return 'bg';}
const MIME=n=>({png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',mp3:'audio/mpeg',ogg:'audio/ogg',wav:'audio/wav',m4a:'audio/mp4'}[(n.split('.').pop()||'').toLowerCase()]||'application/octet-stream');

async function mkThumb(blob,max){try{const u=URL.createObjectURL(blob),i=await loadImg(u);
 const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));
 c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);
 return {thumb:c.toDataURL('image/jpeg',.72),w:i.width,h:i.height};}catch(e){return {thumb:'',w:0,h:0};}}
async function shrink(blob,max,q){const u=URL.createObjectURL(blob),i=await loadImg(u);
 const k=Math.min(1,max/Math.max(i.width,i.height));if(k>=1){URL.revokeObjectURL(u);return blob;}
 const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
 c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);
 const hasA=/png|webp/.test(blob.type);
 return await new Promise(r=>c.toBlob(r,hasA?'image/png':'image/jpeg',q||.86));}

async function addBlob(blob,name,kindForce){
 const kind=kindForce||gkind(name)||'bg';
 let b=blob;
 if(P.settings.autoShrink&&/^image\//.test(blob.type||MIME(name))&&kind!=='ui'){try{b=await shrink(blob,1280,.86);}catch(e){}}
 const rec={uid:auid(),id:nid(kind,name),name,kind,mime:b.type||MIME(name),size:b.size,blob:b,meta:{},deleted:false};
 if(/^image\//.test(rec.mime)){const t=await mkThumb(b,200);rec.thumb=t.thumb;rec.meta.w=t.w;rec.meta.h=t.h;}
 await aPut(rec);AS.push(rec);return rec;}
async function addFiles(fs,kf){let n=0;for(const f of fs){await addBlob(f,f.name,kf);n++;}toast(n+'件追加');rAssets();}

/* ---- zip read ---- */
async function inflate(ab){const st=new Blob([ab]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(st).arrayBuffer());}
function dname(b,u8){try{return new TextDecoder('utf-8',{fatal:true}).decode(b);}catch(e){return new TextDecoder('shift_jis').decode(b);}}
async function unzip(file){const buf=await file.arrayBuffer(),dv=new DataView(buf);let e=-1;

 if(e<0)throw new Error('ZIP形式を認識できません');

 for(let i=0;i<cnt;i++){if(off+46>buf.byteLength||dv.getUint32(off,true)!==0x02014b50)throw Error('ZIPが破損しています');

  if(d&&d.length)out.push({name:nm,data:d});}

function crc32(u){let t=crc32.t;if(!t){t=crc32.t=new Int32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c;}}
 let c=-1;for(let i=0;i<u.length;i++)c=(c>>>8)^t[(c^u[i])&255];return (c^-1)>>>0;}
function zipWrite(files){const enc=new TextEncoder(),ch=[],cd=[];let off=0;
 files.forEach(f=>{const nb=enc.encode(f.name),cr=crc32(f.data),sz=f.data.length;
  const lh=new Uint8Array(30+nb.length),d1=new DataView(lh.buffer);
  d1.setUint32(0,0x04034b50,true);d1.setUint16(4,20,true);d1.setUint16(6,0x0800,true);
  d1.setUint32(14,cr,true);d1.setUint32(18,sz,true);d1.setUint32(22,sz,true);d1.setUint16(26,nb.length,true);
  lh.set(nb,30);ch.push(lh,f.data);
  const c2=new Uint8Array(46+nb.length),d2=new DataView(c2.buffer);
  d2.setUint32(0,0x02014b50,true);d2.setUint16(4,20,true);d2.setUint16(6,20,true);d2.setUint16(8,0x0800,true);
  d2.setUint32(16,cr,true);d2.setUint32(20,sz,true);d2.setUint32(24,sz,true);
  d2.setUint16(28,nb.length,true);d2.setUint32(42,off,true);c2.set(nb,46);cd.push(c2);off+=lh.length+sz;});
 const cds=cd.reduce((n,c)=>n+c.length,0),en=new Uint8Array(22),d3=new DataView(en.buffer);
 d3.setUint32(0,0x06054b50,true);d3.setUint16(8,files.length,true);d3.setUint16(10,files.length,true);
 d3.setUint32(12,cds,true);d3.setUint32(16,off,true);
 return new Blob([...ch,...cd,en],{type:'application/zip'});}

 const opts='<option value="__custom__"'+(currentSid==='__custom__'?' selected':'')+'>自由な話者名</option>'+P.characters.map(c=>
  '<option value="'+esc(c.id)+'"'+(currentSid===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');
 const raw=String(op.text||'').replace(/^「|」$/g,'').replace(/\\n/g,'\n');

  '<label class="f">本文</label><textarea id="msTx" rows="5">'+esc(raw)+'</textarea>'+
  '<label class="f">文字速度（文字/秒・空欄＝全体設定）</label><input type="number" id="msSpeed" min="1" max="240" step="1" placeholder="全体設定" value="'+esc(a.speed||'')+'">'+
  '<label class="f">文字の出方</label><select id="msReveal"><option value=""'+(!a.reveal||a.reveal==='type'?' selected':'')+'>1文字ずつ（標準）</option><option value="instant"'+(a.reveal==='instant'?' selected':'')+'>即時表示</option><option value="fade"'+(a.reveal==='fade'?' selected':'')+'>フェード表示</option><option value="shake"'+(a.reveal==='shake'?' selected':'')+'>震えながら表示</option></select>'+
  '<label class="f">句読点の間</label><select id="msPunct"><option value=""'+(a.punct===undefined?' selected':'')+'>全体設定に従う</option><option value="1"'+(String(a.punct)==='1'?' selected':'')+'>入れる</option><option value="0"'+(String(a.punct)==='0'?' selected':'')+'>入れない</option></select>'+
  '<div id="msNarr"><label class="f">地文の表示</label><select id="msLayout"><option value="box"'+(!a.layout||a.layout==='box'?' selected':'')+'>会話ウィンドウ内</option><option value="center"'+(a.layout==='center'?' selected':'')+'>画面中央</option><option value="black"'+(a.layout==='black'?' selected':'')+'>暗転して中央</option></select></div>'+
  '<div class="row" style="margin-top:7px"><button class="btn sm" id="msFace">この行で表情を変える</button><button class="btn sm" id="msBr">改行を挿入</button></div>'+
  '<div class="row" style="margin-top:11px"><button class="btn ac" style="flex:1" id="msOK">保存</button><button class="btn sm" id="msDup">複製</button><button class="btn sm dg" id="msDel">削除</button></div>',()=>{
  const sync=()=>{const say=$('#msKind').value==='say';$('#msSpeaker').style.display=say?'block':'none';$('#msNarr').style.display=say?'none':'block';$('#msFace').style.display=say?'':'none';};
  $('#msKind').onchange=sync;sync();
  const build=()=>{const type=$('#msKind').value,tx=$('#msTx').value.replace(/\n/g,'\\n'),na={type,text:tx};
   if(type==='say'){const sid=$('#msSp').value;if(sid==='__custom__')na.speaker=($('#msCustom').value.trim()||'？？？').replace(/[【】「」]/g,'');else na.sid=sid;}
   const speed=$('#msSpeed').value.trim();if(speed)na.speed=String(Math.max(1,Math.min(240,+speed||35)));
   const reveal=$('#msReveal').value;if(reveal)na.reveal=reveal;const punct=$('#msPunct').value;if(punct!=='')na.punct=punct;
   if(type==='narr'){const layout=$('#msLayout').value;if(layout&&layout!=='box')na.layout=layout;}
   return ser('msg',na);};
  $('#msBr').onclick=()=>{const t=$('#msTx');const p=t.selectionStart;t.value=t.value.slice(0,p)+'\n'+t.value.slice(p);t.focus();};
  $('#msFace').onclick=async()=>{if($('#msKind').value!=='say')return toast('地文では表情変更を使いません');const sid=$('#msSp').value;if(!sid||sid==='__custom__')return toast('表情を変えるには登録キャラを選んでください');
   const draft=build();const f=await pickFace(sid);if(!f)return;repl(op,[draft]);const L=lines();const prev=(L[op.ln0-1]||'').trim();const line='@chara id='+sid+' face='+f;
   if(/^@chara\s/.test(prev)&&new RegExp('id='+sid+'(\\s|$)').test(prev)){const x=parseArgs(prev.slice(7));x.id=sid;x.face=f;L[op.ln0-1]=ser('chara',x);setLines(L);push();}else insAt(op.ln0,[line]);
   shClose();rScene();toast('表情変更を挿入しました');};
  $('#msOK').onclick=()=>{repl(op,[build()]);shClose();rScene();};
  $('#msDup').onclick=()=>{insAt(op.ln1+1,[build()]);shClose();rScene();};
  $('#msDel').onclick=()=>{delOp(op);shClose();sel=Math.max(0,i-1);rScene();};});}

/* ---- scene menu / validate ---- */
function uniqueSceneId(base){let id=base,i=2;while(P.scenes.some(s=>s.id===id))id=base+'_'+i++;return id;}
function sceneMenu(){const s=P.scenes[cs];
 sheet('シーン','<label class="f">タイトル</label><input type="text" id="smT" value="'+esc(s.title||'')+'">'+
 '<label class="f">シーンID（@jumpの飛び先）</label><input type="text" id="smI" value="'+esc(s.id)+'">'+
 '<label class="f">このシーンの既定UIテーマ</label><select id="smTh"><option value="">（全体設定に従う）</option>'+
  P.themes.map(t=>'<option value="'+esc(t.id)+'"'+(s.theme===t.id?' selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select>'+
 '<div class="row" style="margin-top:11px"><button class="btn ac" id="smOK">保存</button><button class="btn" id="smN">新規</button><button class="btn" id="smD">複製</button></div>'+
 '<div class="row" style="margin-top:6px"><button class="btn" id="smU">↑前へ</button><button class="btn" id="smW">↓後へ</button><button class="btn dg" id="smX">削除</button></div>',()=>{
  $('#smOK').onclick=()=>{const v=$('#smI').value.trim();if(!/^[\w-]+$/.test(v)||['__proto__','constructor','prototype'].includes(v)||P.scenes.some(x=>x!==s&&x.id===v))return toast('シーンIDが不正または重複しています');const old=s.id,oldTitle=s.title;P.scenes.forEach(sc=>{const L=sc.script.split(/\r?\n/);parseScript(sc.script,P.characters).ops.forEach(o=>{let changed=false;if(['jump','goto','if'].includes(o.cmd)){const k=o.cmd==='if'?'jump':o.args.target?'target':'_';if([old,oldTitle].includes(o.args[k])){o.args[k]=v;changed=true;}}if(o.cmd==='choice'){o.opts.forEach(x=>{if([old,oldTitle].includes(x.target)){x.target=v;changed=true;}});if(changed)L.splice(o.ln0,o.ln1-o.ln0+1,'@choice',...o.opts.map(x=>'* '+x.text+' -> '+x.target));}else if(changed)L[o.ln0]=ser(o.cmd,o.args);});sc.script=L.join('\n');});s.title=$('#smT').value.trim();s.id=v;
   s.theme=$('#smTh').value||undefined;push();shClose();rScene();};
  $('#smN').onclick=()=>{P.scenes.push({id:uniqueSceneId('scene'+(P.scenes.length+1)),title:'新規シーン',script:''});cs=P.scenes.length-1;sel=0;push();shClose();rScene();};
  $('#smD').onclick=()=>{const c=JSON.parse(JSON.stringify(s));c.id=uniqueSceneId(c.id+'_copy');c.title=(c.title||'')+'（複製）';
   P.scenes.splice(cs+1,0,c);cs++;push();shClose();rScene();};
  $('#smU').onclick=()=>{if(cs>0){const a=P.scenes.splice(cs,1)[0];P.scenes.splice(--cs,0,a);push();shClose();rScene();}};
  $('#smW').onclick=()=>{if(cs<P.scenes.length-1){const a=P.scenes.splice(cs,1)[0];P.scenes.splice(++cs,0,a);push();shClose();rScene();}};
  $('#smX').onclick=()=>{if(P.scenes.length<2)return toast('最後のシーンは削除できません');
   if(!confirm('削除しますか？'))return;P.scenes.splice(cs,1);cs=0;sel=0;push();shClose();rScene();};});}
function validate(silent){const w=[];errs={};
 P.scenes.forEach((s,sIdx)=>{const {ops,labels}=parseScript(s.script,P.characters);
  ops.forEach((o,oi)=>{const a=o.args||{},id=a.id||a._,tg='S'+(sIdx+1)+' ';
   const bad=m=>{w.push({m:tg+'行'+(o.ln0+1)+'：'+m,s:sIdx,i:oi});if(sIdx===cs)errs[oi]=m;};
   if(!CMD[o.cmd]&&!['msg','choice','note','blank','goto','horror'].includes(o.cmd))bad('不明なコマンド: '+o.cmd);
   if(o.cmd!=='msg'&&s.script.split(/\r?\n/)[o.ln0].includes('＝'))bad('全角＝を半角=に直してください');
   if(o.cmd==='msg'&&o.speaker&&/^「/.test(o.text)&&! /」$/.test(o.text))bad('セリフの閉じ括弧がありません');
   if(o.cmd==='choice'&&!(o.opts||[]).length)bad('選択肢がありません');
   if(['overlay','doc'].includes(o.cmd)&&a.asset&&a.asset!=='off'&&!A(a.asset))bad('素材がありません: '+a.asset);
   if(['bg','cg'].includes(o.cmd)&&!A(id))bad('画像素材 "'+(id||'')+'" が無い');
   if(['bgm','se'].includes(o.cmd)&&!A(id))bad('音声素材 "'+(id||'')+'" が無い');
   if(o.cmd==='chara'){if(a.asset){if(!A(a.asset))bad('素材 "'+a.asset+'" が無い');}
    else{const c=chara(id);if(!c)bad('キャラ "'+(id||'')+'" が未登録');
     else{const f=a.face||'normal';if(!c.faces||!c.faces[f]){if(!c.faces||!Object.values(c.faces).filter(Boolean).length)
      bad(c.name+' に表情素材が未割当');else bad(c.name+' の表情 "'+f+'" が未割当');}}}}
   if(o.cmd==='uitheme'&&!P.themes.some(t=>t.id===id))bad('テーマ "'+(id||'')+'" が無い');
   const jt=(o.cmd==='jump'||o.cmd==='goto')?(a.target||a._):(o.cmd==='if'?a.jump:null);
   if(jt)ck(jt,labels,bad);
   if(o.cmd==='choice')(o.opts||[]).forEach(x=>{if(!x.text)bad('本文が空の選択肢');
    if(!x.target)bad('選択肢の飛び先を選んでください（そのまま進む場合は -）');else if(x.target!=='-')ck(x.target,labels,bad);});});});
 P.scenes.forEach((s,si)=>{const seen=new Set();parseScript(s.script,P.characters).ops.forEach((o,i)=>{if(o.cmd==='label'){const id=o.args._||o.args.name;if(!id||seen.has(id))w.push({m:s.title+'：空または重複ラベル '+id,s:si,i});seen.add(id);}});});P.characters.forEach(c=>Object.values(c.faces||{}).forEach(id=>{if(id&&!A(id))w.push({m:c.name+'：表情素材なし '+id,s:-1});}));P.themes.forEach(t=>Object.values(t.slots||{}).forEach(id=>{if(id&&!A(id))w.push({m:t.name+'：UI素材なし '+id,s:-1});}));const th0=theme(P.settings.theme);
 if(!th0.slots.msg)w.push({m:'UIテーマ「'+th0.name+'」に会話ウィンドウ画像が未設定',s:-1});
 P.scenes.forEach((sc,si)=>{const ops=parseScript(sc.script,P.characters).ops.filter(o=>!['note','blank'].includes(o.cmd));const last=ops[ops.length-1];if(si<P.scenes.length-1&&(!last||last.cmd==='end'))w.push({m:sc.title+'：終了後は並び順で次のシーンへ進みます。分岐ENDには「作品を終了」を使ってください。',s:si,i:Math.max(0,ops.length-1)});});
 P.themes.forEach(t=>{const a=A(t.slots.msg);if(a&&(!a.meta?.nameMode||a.meta.nameMode==='auto'))w.push({m:t.name+'：名前位置は仮設定です。「UI → 位置」でPNGの名前欄に合わせて保存してください。',s:-1});});
 if(silent===true)return w;
 sheet('検証結果',w.length?'<div class="lst2">'+w.map((x,k)=>'<div class="it" data-j="'+k+'"><div class="g"><b class="wn">'+
  esc(x.m)+'</b></div>'+(x.s>=0?'<span class="sb">▶</span>':'')+'</div>').join('')+'</div>'
  :'<div class="sb" style="color:#6fd39b">問題は見つかりませんでした。</div>',()=>{
  $$('#sh [data-j]').forEach(b=>b.onclick=()=>{const x=w[+b.dataset.j];if(x.s<0)return;
   cs=x.s;sel=x.i;shClose();rScene();});});
 rScene();}
function ck(t,labels,bad){if(t[0]==='#'){if(labels[t.slice(1)]===undefined)bad('ラベル "'+t+'" が無い');}
 else if(!P.scenes.some(s=>s.id===t||s.title===t))bad('シーン "'+t+'" が無い');}

function usageHTML(refs){return refs.length?'<div class="lst2">'+refs.map(x=>'<div class="it"><div class="g"><b>'+esc(x.label)+'</b></div></div>').join('')+'</div>':'<p class="sb">使用箇所はありません。</p>';}
function requestTrashAsset(id){const a=A(id);if(!a)return;const refs=assetUsage(id);if(!refs.length){if(!confirm('この素材をゴミ箱へ移動しますか？（Undo・復元できます）'))return;void softDeleteAsset(id);return;}

/* ---- safe area calibrate ---- */
function calib(id){

  $('#crOK').onclick=async()=>{
   const im=await loadImg(url(id));const c=document.createElement('canvas');

 getProject:()=>P, assets:()=>AS, dbtx:(s,m,f)=>dbtx(s,m,f),
 zipWrite:f=>zipWrite(f), unzip:f=>unzip(f), toast:m=>toast(m),
 snapKey:()=>LS_EMERGENCY, storageMode:()=>storageMode, version:()=>STUDIO_VERSION,
 /* 現行本体へ接続 */
 parseScript:text=>parseScript(text,DEF.characters).ops,
 createPlayer:(root,project,resolve,options)=>createPlayer(root,project,resolve,options),
 buildStandalone:()=>htmlShell(runtime(),{}),
 playerResolve:id=>url(id)
};

const _sckRaf=()=>new Promise(r=>requestAnimationFrame(()=>r()));
function _sckKb(n){return (n/1024).toFixed(1)+'KB';}
function _sckShown(el){if(!el||!el.getClientRects().length)return false;
 const s=getComputedStyle(el);return s.visibility!=='hidden'&&s.display!=='none';}
function _sckOv(a,b,t=1){return !(a.right<=b.left+t||a.left>=b.right-t||a.bottom<=b.top+t||a.top>=b.bottom-t);}
function _sckR(el){return el.getBoundingClientRect();}
function _sckN(n){return Math.round(n*10)/10;}
let _sckStub=null;
function _sckStubUrl(){if(!_sckStub){const c=document.createElement('canvas');c.width=c.height=8;
 const x=c.getContext('2d');x.fillStyle='#777';x.fillRect(0,0,8,8);_sckStub=c.toDataURL('image/png');}return _sckStub;}

function _sckTestProject(script){
 const p=JSON.parse(JSON.stringify(DEF));
 p.scenes=[{id:'sck01',title:'selfcheck',script}];
 p.settings.theme='normal';p.settings.textSpeed=0;p.settings.autoWait=1;
 return normalizeProject(p);
}
async function _sckHarness(script,fn){
 if(!ADAPT.createPlayer)throw Error('createPlayer が未接続');
 const box=document.createElement('div');box.dataset.selfcheck='1';
 box.style.cssText='position:fixed;left:0;top:0;width:390px;height:844px;'+
  'opacity:0;pointer-events:none;z-index:-1;overflow:hidden';
 document.body.appendChild(box);let pl=null;
 try{
  pl=ADAPT.createPlayer(box,_sckTestProject(script),ADAPT.playerResolve||(()=>_sckStubUrl()),{});
  await _sckRaf();await _sckRaf();
  box.style.pointerEvents='auto';
  try{box.querySelector('*')&&box.firstElementChild.click();}catch(e){}
  box.style.pointerEvents='none';
  const t0=Date.now();let prev=null,same=0;
  while(Date.now()-t0<2500){await _sckRaf();
   const tx=box.querySelector('.kv-tx'),now=tx?tx.textContent:'';
   if(box.querySelector('.kv-ch.on')){prev='choice';break;}if(now&&now===prev){if(++same>=3)break;}else{same=0;prev=now;}}
  if(!prev)throw Error('本文が描画されない（タップ待ちか初期化失敗の可能性）');
  return await fn(box,pl);
 }finally{
  try{if(pl&&typeof pl.destroy==='function')pl.destroy();}catch(e){}
  box.remove();
 }
}
function _sckPick(script,pred){
 if(!ADAPT.parseScript)throw Error('parseScript が未接続');
 const a=ADAPT.parseScript(script)||[];
 const t=a.find(pred);
 if(!t)throw Error('該当命令が生成されない（先頭3件: '+JSON.stringify(a.slice(0,3)).slice(0,200)+'）');
 return t;
}
/* 現行 parseScript は cmd:'msg' / speaker / text を返す */
const _sckIsSay=o=>!!o&&o.cmd==='msg'&&!!o.speaker;
const _sckIsNarr=o=>!!o&&o.cmd==='msg'&&!o.speaker;
const _sckName=o=>o&&o.speaker!==undefined?String(o.speaker||'').replace(/[\s　]/g,''):(o&&o.name!==undefined?o.name:o&&o.speaker);
const _sckBody=o=>String((o&&(o.text!==undefined?o.text:o.body))||'').replace(/^「([\s\S]*)」$/,'$1');

 const p=ADAPT.getProject(),bad=[];
 p.scenes.forEach(s=>{const t=String(s.script||'');
  const labels=new Set([...t.matchAll(/^@label\s+([^\s]+)/gm)].map(m=>m[1]));

 return{ok:1,msg:'全'+p.scenes.length+'シーンのジャンプ先が存在'};}},

let SCK_RES=[],_sckBusy=false;
async function sckRun(step){
 if(_sckBusy)return SCK_RES;_sckBusy=true;SCK_RES=[];
 try{
  for(const t of SCK_TESTS){
   const row={g:t.g,id:t.id,label:t.label,state:'run',msg:''};
   SCK_RES.push(row);step?.(SCK_RES);await _sckRaf();
   try{
    const o=await Promise.race([t.run(),
     new Promise((_,j)=>setTimeout(()=>j(Error('6秒でタイムアウト')),6000))]);
    row.state=o.skip?'skip':(o.warn?'warn':(o.ok?'ok':'warn'));row.msg=o.msg||'';
   }catch(e){row.state='ng';row.msg=e?.message||String(e);}
   step?.(SCK_RES);
  }
 }finally{
  try{await ADAPT.dbtx('project','readwrite',st=>({q:st.delete(SCK_KEY)}));}catch(e){}
  try{localStorage.removeItem(SCK_KEY);}catch(e){}
  _sckBusy=false;
 }
 return SCK_RES;
}
function sckReport(){
 const n={ok:0,ng:0,warn:0,skip:0};SCK_RES.forEach(x=>{if(n[x.state]!=null)n[x.state]++;});
 const mk={ok:'[OK]',ng:'[NG]',warn:'[注意]',skip:'[skip]',run:'[?]'};
 return ['ADV STUDIO 自己診断 v2','版: '+ADAPT.version()+' / 保存: '+ADAPT.storageMode(),
  '日時: '+new Date().toLocaleString(),'UA: '+navigator.userAgent,
  '画面: '+innerWidth+'x'+innerHeight+' dpr'+(devicePixelRatio||1),
  '結果: 合格'+n.ok+' 不合格'+n.ng+' 注意'+n.warn+' スキップ'+n.skip,'',
  ...SCK_RES.map(x=>mk[x.state]+' '+x.g+'/'+x.id+' '+x.label+(x.msg?' … '+x.msg:''))].join('\n');
}

   +SCK_RES.map(x=>{const h=(x.g!==g?'<div class="gp">'+esc(x.g)+'</div>':'');g=x.g;
    return h+'<div class="rw"><div class="st s-'+x.state+'">'+lab[x.state]+'</div><div class="tx">'
     +esc(x.label)+(x.msg?'<i>'+esc(x.msg)+'</i>':'')+'</div></div>';}).join('');};
 w.addEventListener('click',e=>{
  if(e.target===w||e.target.closest('#sckX'))w.remove();
  else if(e.target.closest('#sckRe'))sckRun(draw).then(draw);
  else if(e.target.closest('#sckCp')){const t=sckReport();
   const fb=()=>{const a=document.createElement('textarea');a.value=t;
    a.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.appendChild(a);
    a.select();try{document.execCommand('copy');}catch(x){}a.remove();};
   navigator.clipboard?.writeText?navigator.clipboard.writeText(t).catch(fb):fb();
   ADAPT.toast('診断結果をコピーしました');}
 });
 sckRun(draw).then(draw);
}
document.addEventListener('click',e=>{if(e.target.closest?.('#bSelfCheck')){e.preventDefault();sckOpen();}});

</script>
</body>
