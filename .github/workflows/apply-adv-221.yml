name: Apply ADV Studio 2.2.1 regression fix

on:
  push:
    branches:
      - fix/adv-studio-2.2.1-name-overlap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrowly-scoped regression patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          def rep(old,new,label,count=1):
              global s
              n=s.count(old)
              if n!=count:
                  raise SystemExit(f'{label}: expected {count}, found {n}')
              s=s.replace(old,new,count)

          rep('<!-- ADV STUDIO 2.2 / Data Safety Phase 1 -->','<!-- ADV STUDIO 2.2.1 / Data Safety Phase 1 -->','version comment')
          rep('<div class="tt" id="hdTitle">暮石村<small>ADV STUDIO 2.2</small></div>','<div class="tt" id="hdTitle">暮石村<small>ADV STUDIO 2.2.1</small></div>','version header')
          rep("const STUDIO_VERSION='2.2',LS_PROJECT='kv_proj2',LS_BACKUP_META='kv_backup_meta2',LS_IOS_NOTICE='kv_ios_home_notice2';","const STUDIO_VERSION='2.2.1',LS_PROJECT='kv_proj2',LS_BACKUP_META='kv_backup_meta2',LS_IOS_NOTICE='kv_ios_home_notice2';",'version const')
          rep('/* Studio 2.2: data safety and guided editing */','/* Studio 2.2.1: data safety and guided editing */','version section comment')

          rep("function writeEmergencySnapshot(){if(storageMode!=='idb')return;try{localStorage.setItem(LS_PROJECT,JSON.stringify(emergencySnapshot(P)));}catch(e){}}", """function writeEmergencySnapshot(){if(storageMode!=='idb')return;const f=writeEmergencySnapshot,now=Date.now();
           const commit=()=>{if(storageMode!=='idb')return;if(f._timer){clearTimeout(f._timer);f._timer=null;}try{localStorage.setItem(LS_PROJECT,JSON.stringify(emergencySnapshot(P)));f._last=Date.now();}catch(e){}};
           if(!f._hooks){f._hooks=true;window.addEventListener('pagehide',commit);document.addEventListener('visibilitychange',()=>{if(document.hidden)commit();});}
           if(!f._last||now-f._last>=30000){commit();return;}if(!f._timer)f._timer=setTimeout(commit,Math.max(0,30000-(now-f._last)));}""", 'writeEmergencySnapshot')

          rep(""".kv-nm{position:absolute;z-index:5;left:3%;top:15%;width:34%;height:32%;display:none;align-items:center;justify-content:center;text-align:center;padding:0;font-size:14px;letter-spacing:.06em;background:none!important;border:0!important;border-radius:0;white-space:nowrap;font-family:serif;pointer-events:none}
          .kv-nm span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden}.kv-cb.im span{display:flex;align-items:center;justify-content:center;overflow:hidden}.kv-ms{min-height:100px;max-height:100%;flex:1}.kv-nm.on{display:flex}""", """.kv-nm{position:relative;z-index:5;display:none;align-self:flex-start;max-width:62%;
           padding:4px 14px;margin:0 0 -1px 10px;background:linear-gradient(#131c26f0,#0a1016f0);
           border:1px solid #ffffff33;border-bottom:0;border-radius:7px 7px 0 0;
           font-size:14px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;
           font-family:serif;pointer-events:none;flex:0 0 auto}
          .kv-nm.on{display:inline-flex;align-items:center}
          .kv-nm span{display:block;width:100%;overflow:hidden;text-overflow:ellipsis}
          .kv.kv-narr-center .kv-nm{display:none!important}
          .kv-cb.im span{display:flex;align-items:center;justify-content:center;overflow:hidden}.kv-ms{min-height:100px;max-height:100%;flex:1}""", 'kv-nm CSS')

          rep("  '</div></div><div class=\"kv-ms\"><div class=\"kv-nm\"><span></span></div><div class=\"kv-tx\"></div><div class=\"kv-nx\">▼</div></div></div>'+", "  '</div></div><div class=\"kv-nm\"><span></span></div><div class=\"kv-ms\"><div class=\"kv-tx\"></div><div class=\"kv-nx\">▼</div></div></div>'+", 'kv-nm DOM move')

          rep(""" const sounds=new Set();let audioLocked=false;let auto=false,skip=false,bgm=null,bgmId=null,muted=false,curBG='',top=false,at=null,wt=null,stat=!!opts.static,baseFS=16;
           function setTheme(id){""", """ const sounds=new Set();let audioLocked=false;let auto=false,skip=false,bgm=null,bgmId=null,muted=false,curBG='',top=false,at=null,wt=null,stat=!!opts.static,baseFS=16,advOverlapWarned=false;
           function advAssertNoOverlap(root){
            if(advOverlapWarned)return;const a=root.querySelector('.kv-nm'),b=root.querySelector('.kv-tx');
            if(!a||!b||!a.classList.contains('on'))return;
            const r1=a.getBoundingClientRect(),r2=b.getBoundingClientRect();
            if(!r1.width||!r2.width)return;
            const ov=!(r1.right<=r2.left||r1.left>=r2.right||r1.bottom<=r2.top||r1.top>=r2.bottom);
            if(ov){advOverlapWarned=true;console.warn('[ADV] 名前枠と本文が重なっています',r1,r2);if(typeof toast==='function')toast('描画不整合：名前枠と本文が重なっています');}
           }
           function setTheme(id){""", 'advAssertNoOverlap definition')

          rep("  E.nmt.textContent=nm;E.nm.classList.toggle('on',!!nm&&kind==='say');\n  const c=(pj.characters||[]).find(x=>x.name===sp);", "  E.nmt.textContent=nm;E.nm.classList.toggle('on',!!nm&&kind==='say');advAssertNoOverlap(root);\n  const c=(pj.characters||[]).find(x=>x.name===sp);", 'advAssertNoOverlap call')

          rep("""  AS.filter(a=>a.kind==='ui').forEach(a=>{Object.keys(SHINT).forEach(k=>{if(!SHINT[k].test(a.name))return;
           const hz=/ホラー|horror|05_|06_|12_/.test(a.name);
           const t=hz?(P.themes.find(x=>x.id==='horror')||P.themes[0]):P.themes[0];
           const key=(k==='msg'||k==='name')?k:k;if(!t.slots[key]){t.slots[key]=a.id;n++;}});});""", """  AS.filter(a=>a.kind==='ui').forEach(a=>{Object.keys(SHINT).forEach(k=>{if(!SHINT[k].test(a.name)||k==='name')return;
           const hz=/ホラー|horror|05_|06_|12_/.test(a.name);
           const t=hz?(P.themes.find(x=>x.id==='horror')||P.themes[0]):P.themes[0];
           if(!t.slots[k]){t.slots[k]=a.id;n++;}});});""", 'rUI uAuto name ignore')

          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/adv-221.js').write_text(s[a:b])
          PY
          node --check /tmp/adv-221.js

          git diff --check
          git diff -- index.html

      - name: Commit only index.html and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-adv-221.yml
          git commit -m "Fix ADV Studio 2.2.1 name overlap regression"
          git push origin HEAD:fix/adv-studio-2.2.1-name-overlap
