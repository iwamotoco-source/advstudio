name: One-time ADV speaker name placement fix

on:
  push:
    paths:
      - ".github/workflows/fix-speaker-name-position.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move speaker name into the dialogue frame
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '.kv-nm{position:relative}.kv-nm.im span'
          new = '.kv-nm{position:absolute;z-index:5;left:16px;top:31px;pointer-events:none}.kv-nm.im span'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one speaker-name positioning rule, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "advstudio-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix speaker name placement in dialogue frame"
          git push

# one-time trigger
