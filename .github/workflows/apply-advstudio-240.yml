name: Apply ADV STUDIO 2.4.0

on:
  push:
    paths:
      - '.github/workflows/apply-advstudio-240.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble uploaded HTML
        shell: bash
        run: |
          cat .tmp_advstudio240/part1.b64 \
              .tmp_advstudio240/part2.b64 \
              .tmp_advstudio240/part3.b64 \
              .tmp_advstudio240/part4.b64 \
            | base64 -d | gzip -d > index.html

      - name: Verify uploaded HTML
        shell: bash
        run: |
          test "$(sha256sum index.html | awk '{print $1}')" = "31a3593dbf1d3d4187ba5144ed2c1910f20ef0022ab44d5bf6081181ad636527"
          grep -q 'ADV STUDIO 2.4.0' index.html
          grep -q '</html>' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          if len(blocks)!=1:
              raise SystemExit(f'expected one inline script, got {len(blocks)}')
          Path('/tmp/advstudio.js').write_text(blocks[0],encoding='utf-8')
          PY
          node --check /tmp/advstudio.js
          echo 'ADV STUDIO 2.4.0 payload verified'

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name 'actions'
          git config user.email 'actions@github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html changes'
            exit 0
          fi
          git commit -m 'Update ADV STUDIO to 2.4.0'
          git push
