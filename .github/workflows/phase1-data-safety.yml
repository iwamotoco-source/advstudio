name: Phase 1 data safety

on:
  push:
    paths:
      - '.github/phase1_patch.py'
      - '.github/workflows/phase1-data-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply phase 1 patch
        run: python .github/phase1_patch.py
      - name: JavaScript syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/advstudio.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/advstudio.js
      - name: Compatibility checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'single html': '<script src=' not in s and 'cdn.' not in s.lower(),
            'player signature': 'function createPlayer(root,pj,resolve,opts)' in s,
            'adv flags': "new CustomEvent('adv:flags'" in s,
            'adv end': "new CustomEvent('adv:end'" in s,
            'getState': 'getState(){return' in s,
            'project store': "createObjectStore('project'" in s,
            'trash': 'function trashSheet' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('compatibility checks OK')
          PY
      - name: Commit index.html
        shell: bash
        run: |
          git config user.name 'actions'
          git config user.email 'actions@github.com'
          git add index.html
          git commit -m 'Phase 1: move project storage to IndexedDB and add data safety'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: advstudio-phase1-index
          path: index.html
          retention-days: 7
