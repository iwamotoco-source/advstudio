name: One-time ADV text presentation features

on:
  push:
    paths:
      - ".github/workflows/add-text-presentation-features.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch ADV Studio
        run: python tools/patch_adv_text_features.py
      - name: Syntax check embedded JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/advstudio.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/advstudio.js
      - name: Commit feature batch
        shell: bash
        run: |
          git config user.name "advstudio-feature-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add dialogue narration and text presentation controls"
          git push
