name: Fix narration quote handling

on:
  push:
    paths:
      - '.github/workflows/fix-narration-quotes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix narration quote handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,label):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          # Scenario card: dialogue gets Japanese quotes, narration explicitly strips a legacy pair.
          rep(
              "  let shown=String(op.text||'').replace(/\\\\n/g,'\\n');if(ma.type==='say')shown='「'+shown.replace(/^「|」$/g,'')+'」';",
              "  let shown=String(op.text||'').replace(/\\\\n/g,'\\n');if(kind==='say')shown='「'+shown.replace(/^「|」$/g,'')+'」';else if(kind==='narr')shown=shown.replace(/^「([\\s\\S]*)」$/,'$1');",
              'card narration quotes'
          )

          # Player/preview: make type authoritative. Narration never renders with an outer Japanese quote pair,
          # even for older saved lines that still contain them in the stored text.
          rep(
              "   case 'msg':{const ma=op.args||{};let tx=String(op.text||'').replace(/\\\\n/g,'\\n');if(ma.type==='say')tx='「'+tx.replace(/^「|」$/g,'')+'」';txt(op.speaker,tx,false,ma);return 'w';}",
              "   case 'msg':{const ma=op.args||{},kind=String(ma.type||(op.speaker?'say':'narr')).toLowerCase();let tx=String(op.text||'').replace(/\\\\n/g,'\\n');if(kind==='say')tx='「'+tx.replace(/^「|」$/g,'')+'」';else if(kind==='narr')tx=tx.replace(/^「([\\s\\S]*)」$/,'$1');txt(op.speaker,tx,false,Object.assign({},ma,{type:kind}));return 'w';}",
              'player narration quotes'
          )

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "else if(kind==='narr')shown=shown.replace" in s
          assert "else if(kind==='narr')tx=tx.replace" in s
          print('narration quote patch OK')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'actions'
          git config user.email 'actions@github.com'
          git add index.html
          git commit -m 'Fix narration showing dialogue quotes'
          git push
