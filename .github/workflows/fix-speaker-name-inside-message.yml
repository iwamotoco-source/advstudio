name: Fix speaker name inside message UI

on:
  push:
    paths:
      - '.github/workflows/fix-speaker-name-inside-message.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move speaker name into built-in message name area
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          # The message-window artwork already contains a name area, so do not expose/use a second name-frame slot.
          rep("const SLOTS=[['msg','会話ウィンドウ'],['name','名前欄'],['choice','選択肢']",
              "const SLOTS=[['msg','会話ウィンドウ'],['choice','選択肢']",
              'slots')

          # Remove the standalone name box from the toolbar row and place only its text inside the message window.
          rep("'<div class=\"kv-mw\"><div class=\"kv-tp\"><div class=\"kv-nm\"><span></span></div><div class=\"kv-tb\">'+",
              "'<div class=\"kv-mw\"><div class=\"kv-tp\"><div class=\"kv-tb\">'+",
              'dom-name-old')
          rep("'</div></div><div class=\"kv-ms\"><div class=\"kv-tx\"></div><div class=\"kv-nx\">▼</div></div></div>'+",
              "'</div></div><div class=\"kv-ms\"><div class=\"kv-nm\"><span></span></div><div class=\"kv-tx\"></div><div class=\"kv-nx\">▼</div></div></div>'+",
              'dom-name-new')

          old_css='''.kv-nm{flex:0 0 auto;display:none;align-items:center;justify-content:center;text-align:center;padding:4px 12px;font-size:14px;letter-spacing:.06em;background:linear-gradient(#1a2431e8,#0d141de8);border:1px solid #ffffff44;border-radius:6px;white-space:nowrap;background-size:100% 100%;font-family:serif}\n.kv-nm{position:absolute;z-index:5;left:16px;top:31px;pointer-events:none}.kv-nm.im span,.kv-cb.im span{display:flex;align-items:center;justify-content:center;overflow:hidden}.kv-ms{min-height:100px;max-height:100%;flex:1}.kv-nm.on{display:flex}.kv-nm.im{background-color:transparent;border:0;background-repeat:no-repeat}'''
          new_css='''.kv-nm{position:absolute;z-index:5;left:3%;top:15%;width:34%;height:32%;display:none;align-items:center;justify-content:center;text-align:center;padding:0;font-size:14px;letter-spacing:.06em;background:none!important;border:0!important;border-radius:0;white-space:nowrap;font-family:serif;pointer-events:none}\n.kv-nm span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden}.kv-cb.im span{display:flex;align-items:center;justify-content:center;overflow:hidden}.kv-ms{min-height:100px;max-height:100%;flex:1}.kv-nm.on{display:flex}'''
          rep(old_css,new_css,'name-css')

          old_theme='''  applyWin(E.nm,E.nmt,t.slots.name,MT,resolve,Object.assign({},t.nameFont,{lh:1.2}),FN,{m:'0'});\n  if(t.slots.name&&MT[t.slots.name]){const m=MT[t.slots.name];E.nm.style.height='';E.nm.style.width='';\n   E.nm.style.aspectRatio=m.w+'/'+m.h;E.nm.style.height='30px';E.nm.style.padding='0';}\n  else{E.nm.style.aspectRatio='';E.nm.style.height='';E.nm.style.padding='4px 12px';}'''
          new_theme='''  const nf=t.nameFont||{f:'mincho',size:14,color:'#fff'};\n  E.nmt.style.fontFamily=(FN[nf.f]||FN.mincho)[1];E.nmt.style.fontSize=(nf.size||14)+'px';E.nmt.style.lineHeight='1.2';\n  E.nmt.style.color=nf.color||'#fff';E.nmt.style.textShadow='0 2px 6px #000c';'''
          rep(old_theme,new_theme,'name-theme')

          rep("  if(c&&c.color&&!(TH[curTh]&&TH[curTh].slots.name))E.nmt.style.color=c.color;",
              "  if(c&&c.color)E.nmt.style.color=c.color;",
              'name-color')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Basic syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<div class="kv-ms"><div class="kv-nm"><span></span></div><div class="kv-tx">' in s
          assert "['name','名前欄']" not in s.split('const SLOTS=',1)[1].split(';',1)[0]
          assert 'background:none!important' in s
          print('speaker name placement patch OK')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'actions'
          git config user.email 'actions@github.com'
          git add index.html
          git commit -m 'Place speaker name inside message window name area'
          git push
